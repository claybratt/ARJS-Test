<!DOCTYPE html>
<html>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- we import arjs version without NFT but with marker + location based support -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/dev/aframe/build/aframe-ar.js"></script>
    <body style="margin : 0px; overflow: hidden;">
        <a-scene vr-mode-ui="enabled: false;" renderer="logarithmicDepthBuffer: true" embedded arjs='sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 4x4_BCH_13_5_5;'>
            <a-assets>
                <a-asset-item id="cube" src="cube.glb"></a-asset-item>
                <a-asset-item id="bamboo" src="bamboo.glb"></a-asset-item>
                <a-asset-item id="ivy" src="ivy.glb"></a-asset-item>
                <a-asset-item id="tigerlily" src="tigerlily.glb"></a-asset-item>
                <a-asset-item id="snakeplant" src="snakeplant.glb"></a-asset-item>
                <a-asset-item id="monstera" src="monstera.glb"></a-asset-item>
                <a-asset-item id="cactus" src="cactus.glb"></a-asset-item>
                <a-asset-item id="tulip" src="tulip.glb"></a-asset-item>
            </a-assets>

            <a-marker  type='barcode' value='0'>
                <a-entity gltf-model="#cube" position="0 0 0" rotation="0 0 0" scale="1 1 1" visible="true"></a-entity>
            </a-marker>
            <a-marker  type='barcode' value='1' >
                <a-entity gltf-model="#bamboo" position="0 0 0" rotation="0 0 0" scale="1 1 1" animation="property: rotation; to: 0 360 0; dur: 30000; easing: linear; loop: true" visible="true"></a-entity>
            </a-marker>
            <a-marker  type='barcode' value='2' >
                <a-entity gltf-model="#ivy" position="0 0 0" rotation="0 0 0" scale="1 1 1" animation="property: rotation; to: 0 360 0; dur: 30000; easing: linear; loop: true" visible="true"></a-entity>
            </a-marker>
            <a-marker  type='barcode' value='3' >
                <a-entity gltf-model="#tigerlily" position="0 0 0" rotation="0 0 0" scale="1 1 1" animation="property: rotation; to: 0 360 0; dur: 30000; easing: linear; loop: true" visible="true"></a-entity>
            </a-marker>
            <a-marker  type='barcode' value='4' >
                <a-entity gltf-model="#snakeplant" position="0 0 0" rotation="0 0 0" scale="1 1 1" animation="property: rotation; to: 0 360 0; dur: 30000; easing: linear; loop: true" visible="true"></a-entity>
            </a-marker>
            <a-marker  type='barcode' value='5' >
                <a-entity gltf-model="#monstera" position="0 0 0" rotation="0 0 0" scale="1 1 1" animation="property: rotation; to: 0 360 0; dur: 30000; easing: linear; loop: true" visible="true"></a-entity>
            </a-marker>
            <a-marker  type='barcode' value='6' >
                <a-entity gltf-model="#cactus" position="0 0 0" rotation="0 0 0" scale="1 1 1" animation="property: rotation; to: 0 360 0; dur: 30000; easing: linear; loop: true" visible="true"></a-entity>
            </a-marker>
            <a-marker  type='barcode' value='7' >
                <a-entity gltf-model="#tulip" position="0 0 0" rotation="0 0 0" scale="1 1 1" animation="property: rotation; to: 0 360 0; dur: 30000; easing: linear; loop: true" visible="true"></a-entity>
            </a-marker>
            <a-entity camera></a-entity>
        </a-scene>
    </body>
</html>
