<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/dev/aframe/build/aframe-ar.js"></script>

    <script>
        AFRAME.registerComponent('marker-persistence', {
            schema: {
                hideDelay: { type: 'number', default: 1000 } // milliseconds
            },

            init: function () {
                this.hideTimeout = null;

                this.el.addEventListener('markerFound', () => {
                    if (this.hideTimeout) {
                        clearTimeout(this.hideTimeout);
                        this.hideTimeout = null;
                    }
                    this.el.object3D.visible = true;
                });

                this.el.addEventListener('markerLost', () => {
                    this.hideTimeout = setTimeout(() => {
                        this.el.object3D.visible = false;
                    }, this.data.hideDelay);
                });
            }
        });
    </script>
</head>

<body style="margin: 0; overflow: hidden;">
    <a-scene
        vr-mode-ui="enabled: false;"
        renderer="logarithmicDepthBuffer: true"
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 4x4_BCH_13_5_5;"
    >
        <a-assets>
            <a-asset-item id="cube" src="cube.glb"></a-asset-item>
            <a-asset-item id="bamboo" src="bamboo.glb"></a-asset-item>
            <a-asset-item id="ivy" src="ivy.glb"></a-asset-item>
            <a-asset-item id="tigerlily" src="tigerlily.glb"></a-asset-item>
            <a-asset-item id="snakeplant" src="snakeplant.glb"></a-asset-item>
            <a-asset-item id="monstera" src="monstera.glb"></a-asset-item>
            <a-asset-item id="cactus" src="cactus.glb"></a-asset-item>
            <a-asset-item id="tulip" src="tulip.glb"></a-asset-item>
        </a-assets>

        <a-marker type="barcode" value="0" emitevents="true" marker-persistence="hideDelay: 1000">
            <a-entity gltf-model="#cube" position="0 0 0" rotation="0 0 0" scale="1 1 1"></a-entity>
        </a-marker>

        <a-marker type="barcode" value="1" emitevents="true" marker-persistence="hideDelay: 1000">
            <a-entity gltf-model="#bamboo" position="0 0 0" rotation="0 0 0" scale="1 1 1"
                animation="property: rotation; to: 0 360 0; dur: 30000; easing: linear; loop: true">
            </a-entity>
        </a-marker>

        <a-marker type="barcode" value="2" emitevents="true" marker-persistence="hideDelay: 1000">
            <a-entity gltf-model="#ivy" position="0 0 0" rotation="0 0 0" scale="1 1 1"
                animation="property: rotation; to: 0 360 0; dur: 30000; easing: linear; loop: true">
            </a-entity>
        </a-marker>

        <a-marker type="barcode" value="3" emitevents="true" marker-persistence="hideDelay: 1000">
            <a-entity gltf-model="#tigerlily" position="0 0 0" rotation="0 0 0" scale="1 1 1"
                animation="property: rotation; to: 0 360 0; dur: 30000; easing: linear; loop: true">
            </a-entity>
        </a-marker>

        <a-marker type="barcode" value="4" emitevents="true" marker-persistence="hideDelay: 1000">
            <a-entity gltf-model="#snakeplant" position="0 0 0" rotation="0 0 0" scale="1 1 1"
                animation="property: rotation; to: 0 360 0; dur: 30000; easing: linear; loop: true">
            </a-entity>
        </a-marker>

        <a-marker type="barcode" value="5" emitevents="true" marker-persistence="hideDelay: 1000">
            <a-entity gltf-model="#monstera" position="0 0 0" rotation="0 0 0" scale="1 1 1"
                animation="property: rotation; to: 0 360 0; dur: 30000; easing: linear; loop: true">
            </a-entity>
        </a-marker>

        <a-marker type="barcode" value="6" emitevents="true" marker-persistence="hideDelay: 1000">
            <a-entity gltf-model="#cactus" position="0 0 0" rotation="0 0 0" scale="1 1 1"
                animation="property: rotation; to: 0 360 0; dur: 30000; easing: linear; loop: true">
            </a-entity>
        </a-marker>

        <a-marker type="barcode" value="7" emitevents="true" marker-persistence="hideDelay: 1000">
            <a-entity gltf-model="#tulip" position="0 0 0" rotation="0 0 0" scale="1 1 1"
                animation="property: rotation; to: 0 360 0; dur: 30000; easing: linear; loop: true">
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
