<!DOCTYPE html>
<html>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/dev/aframe/build/aframe-ar.js"></script>
    <body style="margin : 0px; overflow: hidden;">
        <a-scene embedded vr-mode-ui="enabled: false;" renderer="logarithmicDepthBuffer: true" arjs="debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 4x4_BCH_13_5_5;">
            <a-marker type='pattern' url='pattern-crown_1_qr.patt' min-confidence='0.1'>
                <a-entity
                    position='0 0.5 0.5' 
                    rotation='-90 0 0'>
                    <a-entity obj-model="obj: url(Crown.obj); mtl: url(Crown.mtl)"></a-entity>
                </a-entity>
                <a-entity 
                    position='0 0.5 0.25' 
                    rotation='-90 0 0' 
                    scale="0.4 0.4 0.4">
                    <a-entity  gltf-model="cactus.glb" animation__spin="property: rotation; from: 0 0 0; to: 0 360 0; dur: 5000; easing: linear; loop: true"></a-entity>
                </a-entity>
            </a-marker>
            <a-entity camera></a-entity>
        </a-scene>
    </body>
</html>
